<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020206" />
      <stop offset="50%" stop-color="#040510" />
      <stop offset="100%" stop-color="#020206" />
    </linearGradient>

    
    
    <radialGradient id="nebulaCore" cx="52%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.62" />
      <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#020206" stop-opacity="0" />
      <animate attributeName="r" values="52%;64%;52%" dur="8s" repeatCount="indefinite" />
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="72%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#020206" stop-opacity="0" />
      <animate attributeName="cx" values="72%;66%;72%" dur="11s" repeatCount="indefinite" />
    </radialGradient>

    <radialGradient id="nebulaViolet" cx="28%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#4c1d95" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#020206" stop-opacity="0" />
      <animate attributeName="cy" values="68%;60%;68%" dur="10s" repeatCount="indefinite" />
    </radialGradient>

    
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="btnShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="320" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    
    <rect width="900" height="320" fill="url(#spaceBg)" />
    <rect width="900" height="320" fill="url(#nebulaViolet)" />
    <rect width="900" height="320" fill="url(#nebulaCyan)" />
    <rect width="900" height="320" fill="url(#nebulaCore)" />

    
    <g fill="#e2e8f0" opacity="0.45">
      <circle cx="52" cy="42" r="0.9" /><circle cx="138" cy="28" r="1.1" /><circle cx="215" cy="64" r="0.8" />
      <circle cx="310" cy="34" r="1.0" /><circle cx="395" cy="52" r="0.8" /><circle cx="520" cy="29" r="1.1" />
      <circle cx="615" cy="48" r="0.9" /><circle cx="710" cy="26" r="1.0" /><circle cx="842" cy="44" r="0.9" />
      <circle cx="44" cy="145" r="0.8" /><circle cx="118" cy="195" r="1.0" /><circle cx="195" cy="255" r="0.9" />
      <circle cx="265" cy="288" r="1.1" /><circle cx="645" cy="284" r="0.9" /><circle cx="735" cy="245" r="1.0" />
      <circle cx="815" cy="190" r="0.8" /><circle cx="865" cy="272" r="1.1" /><circle cx="450" cy="295" r="0.9" />
    </g>

    
    <g filter="url(#starGlow)">
      
      <circle cx="92" cy="68" r="1.6" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.1;2.1;1.1" dur="2.8s" begin="0s" repeatCount="indefinite" />
      </circle>
      <circle cx="176" cy="112" r="1.5" fill="#bae6fd">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.7s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.0;1.9;1.0" dur="3.4s" begin="0.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="258" cy="46" r="1.7" fill="#ffffff">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="1.3s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.1;2.2;1.1" dur="3.1s" begin="1.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="348" cy="228" r="1.4" fill="#c4b5fd">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.9s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="565" cy="58" r="1.6" fill="#7dd3fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.1s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.1;2.0;1.1" dur="3.6s" begin="1.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="678" cy="96" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="0.3s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.2;2.3;1.2" dur="2.6s" begin="0.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="768" cy="64" r="1.5" fill="#bae6fd">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="828" cy="132" r="1.7" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="0.9s" repeatCount="indefinite" />
        <animate attributeName="r" values="1.1;2.1;1.1" dur="2.7s" begin="0.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="142" cy="272" r="1.6" fill="#a78bfa">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="715" cy="276" r="1.6" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="0.6s" repeatCount="indefinite" />
      </circle>

      
      <g transform="translate(212, 168)">
        <path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="#ffffff">
          <animate attributeName="opacity" values="0.15;1;0.15" dur="3.5s" begin="0.2s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="scale" values="0.6;1.15;0.6" dur="3.5s" begin="0.2s" repeatCount="indefinite" />
        </path>
      </g>
      <g transform="translate(692, 164)">
        <path d="M0 -6.5 L1.5 -1.5 L6.5 0 L1.5 1.5 L0 6.5 L-1.5 1.5 L-6.5 0 L-1.5 -1.5 Z" fill="#7dd3fc">
          <animate attributeName="opacity" values="0.15;1;0.15" dur="4s" begin="1.4s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="scale" values="0.65;1.2;0.65" dur="4s" begin="1.4s" repeatCount="indefinite" />
        </path>
      </g>
    </g>

    
    <g opacity="0">
      <line x1="640" y1="25" x2="575" y2="68" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="575" cy="68" r="1.8" fill="#ffffff" />
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.70;0.76;0.82;1" dur="9s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="40 -25" to="-90 60" dur="9s" repeatCount="indefinite" />
    </g>

    
    <text x="450" y="108" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">
      Alireza Baghbani
    </text>

    
    <text x="450" y="144" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18.5" font-weight="400" letter-spacing="0.3">
      Computer Science | System Architecture | Practical Apps
    </text>

    
    <g font-family="Consolas, &#39;Fira Code&#39;, &#39;Courier New&#39;, monospace" font-size="17" font-weight="600" fill="#38bdf8" text-anchor="middle">
      <text x="450" y="188" opacity="1">
        Informatik &amp; Systemarchitektur
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.95;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="450" y="188" opacity="0">
        Computer Science &amp; Software Architecture
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="450" y="188" opacity="0">
        Practical Application Specialist
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.33;0.61;0.66;0.95;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>
    </g>

    
    <g filter="url(#btnShadow)">
      <rect x="302" y="236" width="138" height="38" rx="19" fill="url(#tgGrad)" />
      <text x="361" y="260" text-anchor="middle" fill="#082f49" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.6">
        TELEGRAM
      </text>
      <path d="M421 249 L408 254.5 L412.5 256.2 L419 251.2 L414 257 L414.2 261 L416.8 258.2 L419.8 260.4 Z" fill="#082f49" />
    </g>

    
    <g filter="url(#btnShadow)">
      <rect x="460" y="236" width="138" height="38" rx="19" fill="url(#gmGrad)" />
      <text x="519" y="260" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.6">
        GMAIL
      </text>
      <path d="M565 249 H579 V260 H565 Z M565 249 L572 255 L579 249" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linejoin="round" />
    </g>
  </g>
</svg>
